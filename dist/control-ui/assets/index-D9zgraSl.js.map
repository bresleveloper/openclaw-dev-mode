<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>OpenClaw Control</title>
    <meta name="color-scheme" content="dark light" />
    <meta
      id="openclaw-theme-color-light"
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f4f4f4"
    />
    <meta
      id="openclaw-theme-color-dark"
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#111318"
    />
    <link id="openclaw-favicon-svg" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      id="openclaw-favicon-png"
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32.png"
    />
    <link
      id="openclaw-apple-touch-icon"
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />
    <link
      id="openclaw-manifest"
      rel="manifest"
      href="/manifest.webmanifest"
      crossorigin="use-credentials"
    />
    <script data-cfasync="false">
      // Advertise command readiness before deferred startup can outlive document load.
      // The shell listener owner changes this to true after installing its handlers.
      window.__OPENCLAW_NATIVE_COMMANDS_READY__ = false;

      // Configure Zod before module evaluation so its JIT probe cannot violate strict CSP.
      globalThis.__zod_globalConfig ??= {};
      globalThis.__zod_globalConfig.jitless = true;

      (function () {
        // The critical frame can paint while the entry stylesheet downloads.
        // Activate it before the app mounts, including when module loading stalls.
        function activateBootStyles(event) {
          var link = event.target;
          if (link.id !== "openclaw-boot-styles") return;
          link.media = "all";
          document.removeEventListener("load", activateBootStyles, true);
          document.removeEventListener("error", activateBootStyles, true);
        }
        document.addEventListener("load", activateBootStyles, true);
        document.addEventListener("error", activateBootStyles, true);
        var bootBase =
          document.documentElement.getAttribute("data-openclaw-control-ui-base-path") || "";
        var bootPath = location.pathname.slice(bootBase.length) || "/";
        // Keep this data-free route selection in sync with ConnectingSplash.
        var bootRoute = /^\/new\/?$/.test(bootPath)
          ? "new"
          : /^\/(?:settings\/)?sessions\/?$/.test(bootPath)
            ? "sessions"
            : /^\/(?:automations|cron)\/?$/.test(bootPath)
              ? "cron"
              : /^\/settings(?:\/|$)/.test(bootPath)
                ? "settings"
                : /^\/chat(?:\/|$)/.test(bootPath) &&
                    !new URLSearchParams(location.search).has("catalog")
                  ? "chat"
                  : "other";
        document.documentElement.setAttribute("data-openclaw-boot-route", bootRoute);
        document.documentElement.toggleAttribute("data-openclaw-boot-chat", bootRoute === "chat");
        var THEMES = {
          claw: 1,
          knot: 1,
          dash: 1,
          absolutely: 1,
          tide: 1,
          beacon: 1,
          phosphor: 1,
          crt: 1,
          manuscript: 1,
          rose: 1,
          miami: 1,
        };
        var MODES = { system: 1, light: 1, dark: 1 };
        var LEGACY = {
          dark: "claw:dark",
          light: "claw:light",
          openknot: "knot:dark",
          fieldmanual: "dash:dark",
          clawdash: "dash:light",
          system: "claw:system",
        };
        try {
          var keys = Object.keys(localStorage);
          var raw;
          for (var i = 0; i < keys.length; i++) {
            if (keys[i].indexOf("openclaw.control.settings.v1") === 0) {
              raw = localStorage.getItem(keys[i]);
              if (raw) break;
            }
          }
          var s = raw ? JSON.parse(raw) : null;
          // A hint only: startup still admits the account and exact snapshot.
          var bootScope =
            (location.protocol === "https:" ? "wss:" : "ws:") + "//" + location.host + bootBase;
          if (
            bootRoute === "chat" &&
            localStorage.getItem("openclaw.control.bootRecord.v1:" + bootScope)
          ) {
            document.documentElement.setAttribute("data-openclaw-warm-frame", "holding");
            var warmDeadline = performance.now() + 450;
            // Check wall time before paint; a delayed frame's animation timestamp can be stale.
            function expireWarmFrame() {
              if (document.documentElement.getAttribute("data-openclaw-warm-frame") !== "holding")
                return;
              if (performance.now() >= warmDeadline)
                document.documentElement.setAttribute("data-openclaw-warm-frame", "fallback");
              else requestAnimationFrame(expireWarmFrame);
            }
            requestAnimationFrame(expireWarmFrame);
          }
          if (s && typeof s.navWidth === "number" && s.navWidth >= 240 && s.navWidth <= 400) {
            document.documentElement.style.setProperty(
              "--openclaw-boot-nav-width",
              s.navWidth + "px",
            );
          }
          // The boot composer follows the saved send shortcut before the app loads.
          if (s && s.chatSendShortcut === "modifier-enter") {
            document.documentElement.setAttribute("data-openclaw-boot-send-shortcut", "modifier");
          }
          var t = s && s.theme;
          var m = s && s.themeMode;
          if (typeof t !== "string") t = "";
          if (typeof m !== "string") m = "";
          var legacy = LEGACY[t];
          var theme = THEMES[t] ? t : legacy ? legacy.split(":")[0] : "claw";
          var mode = MODES[m] ? m : legacy ? legacy.split(":")[1] : "system";
          if (mode === "system") {
            mode = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          // family -> [dark, light] resolved names. Kept in lockstep with
          // resolveTheme() in app/theme.ts and the files in public/themes.
          var FAMILIES = {
            knot: ["openknot", "openknot-light"],
            dash: ["dash", "dash-light"],
            absolutely: ["absolutely", "absolutely-light"],
            tide: ["tide", "tide-light"],
            beacon: ["beacon", "beacon-light"],
            phosphor: ["phosphor", "phosphor-light"],
            crt: ["crt", "crt-light"],
            manuscript: ["manuscript", "manuscript-light"],
            rose: ["rose", "rose-light"],
            miami: ["miami", "miami-light"],
          };
          var pair = FAMILIES[theme];
          var resolved = pair
            ? pair[mode === "light" ? 1 : 0]
            : mode === "light"
              ? "light"
              : "dark";
          if (pair) {
            // Script-created links need explicit render blocking before first paint.
            // The gateway stamps the mount prefix and asset version before this runs.
            var base =
              document.documentElement.getAttribute("data-openclaw-control-ui-base-path") || "";
            var buildId = document.documentElement.getAttribute(
              "data-openclaw-control-ui-build-id",
            );
            // Keep the first-paint URL identical to app/public-assets.ts.
            var version = buildId ? "?v=" + encodeURIComponent(buildId.slice(-64)) : "";
            var palette = document.createElement("link");
            palette.rel = "stylesheet";
            palette.setAttribute("blocking", "render");
            palette.id = "openclaw-theme-palette-" + theme;
            palette.onerror = function () {
              palette.remove();
            };
            palette.href = base + "/themes/" + theme + ".css" + version;
            document.head.appendChild(palette);
          }
          document.documentElement.setAttribute("data-theme", resolved);
          var resolvedMode = resolved.includes("light") ? "light" : "dark";
          document.documentElement.setAttribute("data-theme-mode", resolvedMode);
          // Plugin semantic styles select on [data-theme-resolved]; keep in lockstep.
          document.documentElement.setAttribute("data-theme-resolved", resolvedMode);
        } catch (e) {}
      })();
    </script>
    <style>
      /* Paint before the app stylesheet arrives so WebKit never exposes a white
         document between its native dark canvas and the persisted UI theme. */
      html,
      body {
        min-height: 100%;
      }

      html {
        background: #111318;
        color-scheme: dark;
      }

      html[data-theme-mode="light"] {
        background: #f4f4f4;
        color-scheme: light;
      }

      html[data-theme="openknot"] {
        background: #0c0c0c;
      }

      html[data-theme="openknot-light"] {
        background: #f0f0f3;
      }

      html[data-theme="dash"] {
        background: #1e1613;
      }

      html[data-theme="dash-light"] {
        background: #e8e2dc;
      }

      html[data-theme="absolutely"] {
        background: #1f1f1e;
      }

      html[data-theme="absolutely-light"] {
        background: #f3f2f1;
      }

      html[data-theme="tide"] {
        background: #14191f;
      }

      html[data-theme="tide-light"] {
        background: #edeff1;
      }

      html[data-theme="beacon"] {
        background: #050505;
      }

      html[data-theme="beacon-light"] {
        background: #f3f3f3;
      }

      html[data-theme="phosphor"] {
        background: #0e130e;
      }

      html[data-theme="phosphor-light"] {
        background: #edf0ed;
      }

      html[data-theme="crt"] {
        background: #0d0e0d;
      }

      html[data-theme="crt-light"] {
        background: #f0f0f0;
      }

      html[data-theme="manuscript"] {
        background: #25221b;
      }

      html[data-theme="manuscript-light"] {
        background: #edece6;
      }

      html[data-theme="rose"] {
        background: #1d1b28;
      }

      html[data-theme="rose-light"] {
        background: #edeae7;
      }

      html[data-theme="miami"] {
        background: #181322;
      }

      html[data-theme="miami-light"] {
        background: #f2eef1;
      }

      body {
        margin: 0;
        min-height: 100%;
        background: inherit;
        color-scheme: inherit;
      }

      html[data-openclaw-warm-frame="holding"],
      html[data-openclaw-warm-frame="holding"] body {
        background: transparent !important;
      }
      html[data-openclaw-warm-frame="holding"] body {
        opacity: 0;
      }

      /* Critical loading layout lives here so HTML and the Solid fallback share
         one geometry owner before either the entry stylesheet or JS arrives. */
      openclaw-app {
        display: block;
        box-sizing: border-box;
        height: var(--shell-canvas-height, 100dvh);
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }

      /* Connection and route loading share the document's static placeholder paint. */
      .connect-splash--skeleton,
      .content--workbench .lazy-view-state--route {
        --boot-ink: var(--text, #bcbcc0);
        --boot-line: color-mix(in srgb, var(--boot-ink) 10%, transparent);
        --boot-content-bg: #0e1015;
      }

      .content--workbench .lazy-view-state--route {
        position: relative;
        background: var(--bg-content, var(--boot-content-bg));
        container-type: inline-size;
        min-height: 0;
      }

      .connect-splash.connect-splash--skeleton {
        position: relative;
        display: flex;
        align-items: stretch;
        box-sizing: border-box;
        height: 100vh;
        height: var(
          --shell-content-height,
          calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px))
        );
        overflow: hidden;
        background: var(--bg, inherit);
        opacity: 1;
        animation: none;
      }

      html[data-theme-mode="light"]
        :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route) {
        --boot-ink: var(--text, #353535);
        --boot-content-bg: #f8f8f8;
      }

      .connect-splash__layout {
        display: grid;
        grid-template-columns: calc(var(--openclaw-boot-nav-width, 258px) + 52px) minmax(0, 1fr);
        width: 100%;
        height: 100%;
        min-height: 0;
      }

      .connect-splash__main {
        position: relative;
        container-type: inline-size;
        min-width: 0;
        min-height: 0;
        height: 100%;
        background: var(--bg-content, var(--boot-content-bg));
      }

      .connect-splash__sidebar {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 24px;
        box-sizing: border-box;
        padding: 16px 20px 16px 72px;
        border-inline-end: 1px solid var(--boot-line);
      }

      .connect-splash__sidebar::before {
        position: absolute;
        inset: 0 auto 0 0;
        width: 51px;
        border-inline-end: 1px solid var(--boot-line);
        content: "";
      }

      .connect-splash__new-session {
        height: 32px;
        margin: 8px 0;
      }

      .connect-splash__sidebar > .skeleton-line:nth-child(even) {
        width: 65%;
      }

      :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route) .skeleton {
        position: relative;
        overflow: hidden;
        border-radius: 6px;
        background: color-mix(in srgb, var(--boot-ink) 8%, transparent);
      }

      /* Static placeholders do not animate or hold compositor layers during boot. */
      :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route) .skeleton::after {
        content: none;
        animation: none;
      }

      :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route) .skeleton-line {
        height: 14px;
      }

      :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
        .skeleton-line--medium {
        width: 65%;
      }

      :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
        .skeleton-line--long {
        width: 85%;
      }

      .connect-splash--skeleton .connect-splash__status {
        display: block;
        position: absolute;
        inset: auto 18px 50px;
        margin: 0;
        color: var(--boot-ink);
        font:
          14px/20px system-ui,
          sans-serif;
        letter-spacing: normal;
        -webkit-font-smoothing: auto;
        text-align: center;
      }

      :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
        .loading-skeleton {
        box-sizing: border-box;
        gap: 0;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        padding: 0 18px 14px;
      }

      :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
        .loading-skeleton__header {
        box-sizing: border-box;
        display: flex;
        flex: none;
        align-items: center;
        gap: 14px;
        height: 44px;
        margin-inline: -18px;
        padding-inline: 12px;
        padding-bottom: 0;
        border-bottom: 1px solid var(--boot-line, var(--border));
      }

      :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
        .loading-skeleton__avatar {
        flex: none;
        width: 32px;
        height: 32px;
        border-radius: 50%;
      }

      :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
        .loading-skeleton__title {
        width: 140px;
      }

      :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
        .loading-skeleton__messages {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 48px;
        width: min(100%, 48rem);
        margin: 28px auto 0;
      }

      :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
        .loading-skeleton__message {
        display: grid;
        gap: 14px;
        width: 85%;
      }

      :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
        .loading-skeleton__message--user {
        align-self: flex-end;
        width: 48%;
      }

      :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
        .loading-skeleton__composer {
        box-sizing: border-box;
        flex: none;
        width: min(100%, 48rem);
        height: 92px;
        margin: 8px auto 0;
        border: 1px solid var(--boot-line, var(--border));
        border-radius: 20px;
      }

      /* Chat frames hold the live boot composer; status text stays above it.
         First-paint tokens only, so every loading frame paints identical pixels.
         Sizes mirror the chat composer (one editor line plus its action row,
         growing to six lines) so the handoff keeps text and frame still. */
      html:not([data-openclaw-boot-chat]) #openclaw-boot-composer {
        display: none;
      }

      /* The chat composer's surface; fallbacks match the default theme's tokens
         until the app stylesheet defines --chat-composer-surface. */
      html[data-openclaw-boot-chat]
        :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
        .loading-skeleton__composer:has(> #openclaw-boot-composer) {
        height: auto;
        background: var(
          --chat-composer-surface,
          color-mix(in srgb, var(--boot-ink) 14%, var(--bg-content, var(--boot-content-bg)))
        );
      }

      html[data-openclaw-boot-chat][data-theme-mode="light"]
        :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
        .loading-skeleton__composer:has(> #openclaw-boot-composer) {
        background: var(
          --chat-composer-surface,
          color-mix(in srgb, var(--bg-content, var(--boot-content-bg)) 50%, white)
        );
      }

      #openclaw-boot-composer {
        display: block;
        box-sizing: border-box;
        width: 100%;
        min-height: 86px;
        max-height: 188px;
        field-sizing: content;
        margin: 0;
        padding: 12px 14px 50px;
        border: 0;
        border-radius: inherit;
        background: none;
        color: var(--boot-ink);
        font:
          14px/21px system-ui,
          sans-serif;
        letter-spacing: normal;
        -webkit-font-smoothing: auto;
        resize: none;
        outline: none;
      }

      #openclaw-boot-composer::placeholder,
      #openclaw-boot-composer[data-submit-queued] {
        color: color-mix(in srgb, var(--boot-ink) 55%, transparent);
        opacity: 1;
      }

      .connect-splash[data-chat] .connect-splash__status {
        bottom: 132px;
      }

      /* A growing draft needs no status text over it. */
      .connect-splash__main:has(> .loading-skeleton #openclaw-boot-composer:not(:placeholder-shown))
        > .connect-splash__status {
        visibility: hidden;
      }

      @media (max-width: 900px) {
        :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
          .loading-skeleton:has(#openclaw-boot-composer:focus, .loading-skeleton__content) {
          padding-bottom: 10px;
        }
      }

      @media (max-width: 900px),
        (max-width: 932px) and (max-height: 500px) and (orientation: landscape) {
        /* Merged web chrome uses the mobile composer; native shells retain its base gap. */
        html:not(.openclaw-native-macos, .openclaw-native-nav, .openclaw-native-web-chrome)
          :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
          .loading-skeleton:has(#openclaw-boot-composer:focus, .loading-skeleton__content) {
          padding-bottom: 10px;
        }
      }

      @media (max-width: 932px) and (max-height: 500px) and (orientation: landscape) {
        html:not(.openclaw-native-macos, .openclaw-native-nav, .openclaw-native-web-chrome)
          :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
          .loading-skeleton:has(#openclaw-boot-composer) {
          /* Measure available width outside the border, like the live composer. */
          container-name: chat-composer;
          container-type: inline-size;
          padding-inline: 16px;
        }

        html[data-openclaw-boot-chat]:not(
            .openclaw-native-macos,
            .openclaw-native-nav,
            .openclaw-native-web-chrome
          )
          :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
          .loading-skeleton:has(#openclaw-boot-composer:focus)
          > .loading-skeleton__messages:not(.loading-skeleton__content) {
          /* Decorative messages yield space to the focused composer in a short pane. */
          min-height: 0;
          overflow: hidden;
        }

        @container chat-composer (max-width: 560px) {
          html[data-openclaw-boot-chat]:not(
              .openclaw-native-macos,
              .openclaw-native-nav,
              .openclaw-native-web-chrome
            )
            :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
            .loading-skeleton:has(#openclaw-boot-composer:focus, .loading-skeleton__content)
            .loading-skeleton__composer:has(> #openclaw-boot-composer) {
            /* Match the native mobile editor's three-line cap and footer. */
            min-height: 112px;
            padding: 6px 0 48px;
          }

          html[data-openclaw-boot-chat]:not(
              .openclaw-native-macos,
              .openclaw-native-nav,
              .openclaw-native-web-chrome
            )
            :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
            .loading-skeleton:has(#openclaw-boot-composer:focus, .loading-skeleton__content)
            .loading-skeleton__composer
            > #openclaw-boot-composer {
            min-height: 32px;
            max-height: calc(3lh + 12px);
            padding: 6px 14px;
            overflow-y: auto;
          }
        }

        @container chat-composer (width > 560px) {
          html[data-openclaw-boot-chat]:not(
              .openclaw-native-macos,
              .openclaw-native-nav,
              .openclaw-native-web-chrome
            )
            :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
            .loading-skeleton:has(#openclaw-boot-composer:focus, .loading-skeleton__content)
            .loading-skeleton__composer:has(> #openclaw-boot-composer) {
            /* Reserve the live row and footer outside the editor's scrollport. */
            min-height: 112px;
            padding: 6px 0 48px;
          }

          html[data-openclaw-boot-chat]:not(
              .openclaw-native-macos,
              .openclaw-native-nav,
              .openclaw-native-web-chrome
            )
            :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
            .loading-skeleton:has(#openclaw-boot-composer:focus, .loading-skeleton__content)
            .loading-skeleton__composer
            > #openclaw-boot-composer {
            min-height: 32px;
            max-height: calc(3lh + 12px);
            padding: 10px 12px;
            overflow-y: auto;
          }
        }
      }

      @media (max-width: 768px) {
        /* The idle mobile capsule shows one line beside its attachment button;
           focus opens the editing form like the chat composer. */
        #openclaw-boot-composer {
          min-height: 50px;
          max-height: 50px;
          padding: 13px 16px 0 42px;
          line-height: 24px;
        }

        html[data-openclaw-boot-chat]
          :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
          .loading-skeleton__composer:has(> #openclaw-boot-composer:focus) {
          border-radius: 20px;
        }

        /* Recovery controls must not move between pointer down and click when
           the editor loses focus. Keep its editing space while recovery is shown. */
        #openclaw-boot-composer:focus,
        .loading-skeleton:has(.loading-skeleton__content) #openclaw-boot-composer {
          min-height: 90px;
          max-height: 192px;
          padding: 12px 14px 54px;
          line-height: 21px;
        }
      }

      @media (pointer: coarse) {
        #openclaw-boot-composer {
          /* Touch browsers zoom into editors below 16px. */
          font-size: 16px;
          line-height: 24px;
        }
      }

      @media (pointer: coarse) and (max-width: 768px) {
        #openclaw-boot-composer:focus {
          max-height: 210px;
          line-height: 24px;
        }
      }

      @media (min-width: 769px) {
        html[data-openclaw-boot-chat] #openclaw-boot-shell .loading-skeleton__composer,
        .connect-splash[data-chat] .loading-skeleton__composer,
        .content--workbench .lazy-view-state--route .loading-skeleton__composer {
          /* Match composer-surface: one editor line, five vertical insets,
             the send control, the footer margin, and both surface borders. */
          height: max(
            var(--chat-composer-min-height, 88px),
            calc(
              var(--chat-composer-editor-line, calc(var(--control-ui-text-md, 14px) * 1.5)) +
                var(--chat-composer-editor-inset-block, 6px) * 5 +
                var(--chat-composer-send-size, 32px) + 4px + 2px
            )
          );
        }
      }

      /* Use the same skeleton nodes before and after Solid takes over. New
         Session starts with its welcome and draft, never a chat transcript. */
      :is(
          html[data-openclaw-boot-route="new"] #openclaw-boot-shell,
          .connect-splash[data-route="new"]
        )
        .loading-skeleton {
        padding-top: calc(clamp(44px, 5vh, 52px) + clamp(20px, 4vh, 40px));
        padding-inline: 36px;
      }

      :is(
          html[data-openclaw-boot-route="new"] #openclaw-boot-shell,
          .connect-splash[data-route="new"]
        )
        .loading-skeleton__header {
        flex-direction: column;
        gap: 12px;
        height: auto;
        margin: 0;
        padding: 0;
        border: 0;
      }

      :is(
          html[data-openclaw-boot-route="new"] #openclaw-boot-shell,
          .connect-splash[data-route="new"]
        )
        .loading-skeleton__header
        .loading-skeleton__avatar {
        width: 96px;
        height: 96px;
      }

      :is(
          html[data-openclaw-boot-route="new"] #openclaw-boot-shell,
          .connect-splash[data-route="new"]
        )
        .loading-skeleton__title {
        width: 160px;
        height: 30px;
      }

      :is(
          html[data-openclaw-boot-route="new"] #openclaw-boot-shell,
          .connect-splash[data-route="new"]
        )
        .loading-skeleton__messages {
        flex: none;
        gap: 0;
        margin-top: 6px;
      }

      :is(
          html[data-openclaw-boot-route="new"] #openclaw-boot-shell,
          .connect-splash[data-route="new"]
        )
        .loading-skeleton__message--user {
        align-self: center;
        width: 100%;
        justify-items: center;
        gap: 44px;
      }

      :is(
          html[data-openclaw-boot-route="new"] #openclaw-boot-shell,
          .connect-splash[data-route="new"]
        )
        .loading-skeleton__message--user
        > :first-child {
        width: min(100%, 280px);
        height: 20px;
      }

      :is(
          html[data-openclaw-boot-route="new"] #openclaw-boot-shell,
          .connect-splash[data-route="new"]
        )
        .loading-skeleton__message--user
        > :last-child {
        width: 100%;
        height: 32px;
      }

      :is(
          html[data-openclaw-boot-route="new"] #openclaw-boot-shell,
          .connect-splash[data-route="new"]
        )
        .loading-skeleton__message:not(.loading-skeleton__message--user) {
        display: none;
      }

      :is(
          html[data-openclaw-boot-route="new"] #openclaw-boot-shell,
          .connect-splash[data-route="new"]
        )
        .loading-skeleton__composer {
        height: 144px;
        border-radius: 12px;
      }

      /* Settings owns a narrower sidebar; list routes retain the normal
         rail. No route below starts with a transcript or a chat composer. */
      :is(
          html[data-openclaw-boot-route="settings"] #openclaw-boot-shell,
          .connect-splash[data-route="settings"]
        )
        .connect-splash__layout {
        grid-template-columns: 288px minmax(0, 1fr);
      }

      :is(
          html[data-openclaw-boot-route="settings"] #openclaw-boot-shell,
          .connect-splash[data-route="settings"]
        )
        .connect-splash__sidebar {
        padding-inline-start: 20px;
      }

      :is(
          html[data-openclaw-boot-route="settings"] #openclaw-boot-shell,
          .connect-splash[data-route="settings"]
        )
        .connect-splash__sidebar::before {
        display: none;
      }

      :is(
          html[data-openclaw-boot-route="settings"] #openclaw-boot-shell,
          .connect-splash[data-route="settings"],
          html[data-openclaw-boot-route="sessions"] #openclaw-boot-shell,
          .connect-splash[data-route="sessions"],
          html[data-openclaw-boot-route="cron"] #openclaw-boot-shell,
          .connect-splash[data-route="cron"]
        )
        .loading-skeleton {
        padding: 6px 20px 32px;
      }

      :is(
          html[data-openclaw-boot-route="settings"] #openclaw-boot-shell,
          .connect-splash[data-route="settings"],
          html[data-openclaw-boot-route="sessions"] #openclaw-boot-shell,
          .connect-splash[data-route="sessions"],
          html[data-openclaw-boot-route="cron"] #openclaw-boot-shell,
          .connect-splash[data-route="cron"]
        )
        .loading-skeleton__header {
        width: min(100%, 1120px);
        height: 40px;
        justify-content: center;
        margin: 0 auto;
        padding: 0;
        border: 0;
      }

      :is(
          html[data-openclaw-boot-route="settings"] #openclaw-boot-shell,
          .connect-splash[data-route="settings"],
          html[data-openclaw-boot-route="sessions"] #openclaw-boot-shell,
          .connect-splash[data-route="sessions"],
          html[data-openclaw-boot-route="cron"] #openclaw-boot-shell,
          .connect-splash[data-route="cron"]
        )
        .loading-skeleton__header
        .loading-skeleton__avatar,
      :is(
          html[data-openclaw-boot-route="settings"] #openclaw-boot-shell,
          .connect-splash[data-route="settings"],
          html[data-openclaw-boot-route="sessions"] #openclaw-boot-shell,
          .connect-splash[data-route="sessions"],
          html[data-openclaw-boot-route="cron"] #openclaw-boot-shell,
          .connect-splash[data-route="cron"]
        )
        .loading-skeleton__message
        .loading-skeleton__avatar,
      :is(
          html[data-openclaw-boot-route="settings"] #openclaw-boot-shell,
          .connect-splash[data-route="settings"],
          html[data-openclaw-boot-route="sessions"] #openclaw-boot-shell,
          .connect-splash[data-route="sessions"],
          html[data-openclaw-boot-route="cron"] #openclaw-boot-shell,
          .connect-splash[data-route="cron"]
        )
        .loading-skeleton__composer {
        display: none;
      }

      :is(
          html[data-openclaw-boot-route="settings"] #openclaw-boot-shell,
          .connect-splash[data-route="settings"],
          html[data-openclaw-boot-route="sessions"] #openclaw-boot-shell,
          .connect-splash[data-route="sessions"],
          html[data-openclaw-boot-route="cron"] #openclaw-boot-shell,
          .connect-splash[data-route="cron"]
        )
        .loading-skeleton__title {
        height: 26px;
        width: 180px;
      }

      :is(
          html[data-openclaw-boot-route="settings"] #openclaw-boot-shell,
          .connect-splash[data-route="settings"],
          html[data-openclaw-boot-route="sessions"] #openclaw-boot-shell,
          .connect-splash[data-route="sessions"],
          html[data-openclaw-boot-route="cron"] #openclaw-boot-shell,
          .connect-splash[data-route="cron"]
        )
        .loading-skeleton__messages {
        flex: none;
        gap: 24px;
        width: min(100%, 1120px);
        margin-top: 32px;
      }

      :is(
          html[data-openclaw-boot-route="settings"] #openclaw-boot-shell,
          .connect-splash[data-route="settings"],
          html[data-openclaw-boot-route="sessions"] #openclaw-boot-shell,
          .connect-splash[data-route="sessions"],
          html[data-openclaw-boot-route="cron"] #openclaw-boot-shell,
          .connect-splash[data-route="cron"]
        )
        .loading-skeleton__message {
        width: 100%;
        gap: 24px;
      }

      :is(
          html[data-openclaw-boot-route="settings"] #openclaw-boot-shell,
          .connect-splash[data-route="settings"],
          html[data-openclaw-boot-route="sessions"] #openclaw-boot-shell,
          .connect-splash[data-route="sessions"],
          html[data-openclaw-boot-route="cron"] #openclaw-boot-shell,
          .connect-splash[data-route="cron"]
        )
        .loading-skeleton__message--user {
        align-self: stretch;
      }

      :is(
          html[data-openclaw-boot-route="settings"] #openclaw-boot-shell,
          .connect-splash[data-route="settings"]
        )
        .loading-skeleton {
        padding: 44px clamp(28px, 5vw, 72px) 32px;
      }

      :is(
          html[data-openclaw-boot-route="settings"] #openclaw-boot-shell,
          .connect-splash[data-route="settings"]
        )
        .loading-skeleton__header {
        justify-content: flex-start;
      }

      /* Chat Details automatically reserves 300px plus its 13px inset in a
         frame at least 1200px wide. Match that first painted destination. */
      @container (min-width: 1200px) {
        html[data-openclaw-boot-chat] #openclaw-boot-shell .loading-skeleton,
        .connect-splash[data-chat] .loading-skeleton,
        .content--workbench .lazy-view-state--route .loading-skeleton {
          padding-inline-end: 331px;
        }

        html[data-openclaw-boot-chat] #openclaw-boot-shell .loading-skeleton__header,
        .connect-splash[data-chat] .loading-skeleton__header,
        .content--workbench .lazy-view-state--route .loading-skeleton__header {
          margin-inline-end: -331px;
        }

        .connect-splash[data-chat] .connect-splash__status {
          inset-inline-end: 331px;
        }
      }

      @media (max-width: 900px),
        (max-width: 932px) and (max-height: 500px) and (orientation: landscape) {
        .connect-splash__layout {
          grid-template-columns: minmax(0, 1fr);
        }

        :is(
            html[data-openclaw-boot-route="settings"] #openclaw-boot-shell,
            .connect-splash[data-route="settings"]
          )
          .connect-splash__layout {
          grid-template-columns: minmax(0, 1fr);
        }

        .connect-splash__sidebar {
          display: none;
        }

        .connect-splash--skeleton .connect-splash__status {
          inset-inline-start: 18px;
        }
      }

      @media (max-width: 768px) {
        :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
          .loading-skeleton {
          padding: 0 16px 10px;
        }

        :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
          .loading-skeleton__header {
          height: 58px;
          margin-inline: -16px;
        }

        :is(.connect-splash--skeleton, .content--workbench .lazy-view-state--route)
          .loading-skeleton__composer {
          height: 52px;
          border-radius: 22px;
        }

        .connect-splash--skeleton .connect-splash__status {
          bottom: 26px;
        }

        .connect-splash[data-chat] .connect-splash__status {
          bottom: 112px;
        }
      }

      @media (max-width: 768px),
        (max-width: 932px) and (max-height: 500px) and (orientation: landscape) {
        :is(
            html[data-openclaw-boot-route="new"] #openclaw-boot-shell,
            .connect-splash[data-route="new"]
          )
          .loading-skeleton {
          justify-content: center;
          padding: 76px 18px 24px;
        }

        :is(
            html[data-openclaw-boot-route="new"] #openclaw-boot-shell,
            .connect-splash[data-route="new"]
          )
          .loading-skeleton__header
          .loading-skeleton__avatar {
          width: 56px;
          height: 56px;
        }

        :is(
            html[data-openclaw-boot-route="new"] #openclaw-boot-shell,
            .connect-splash[data-route="new"]
          )
          .loading-skeleton__title {
          height: 24px;
        }

        :is(
            html[data-openclaw-boot-route="new"] #openclaw-boot-shell,
            .connect-splash[data-route="new"]
          )
          .loading-skeleton__message--user {
          gap: 24px;
        }
      }

      @media (max-width: 768px) and (max-height: 500px),
        (max-width: 932px) and (max-height: 500px) and (orientation: landscape) {
        :is(
            html[data-openclaw-boot-route="new"] #openclaw-boot-shell,
            .connect-splash[data-route="new"]
          )
          .loading-skeleton {
          padding-top: 64px;
        }

        :is(
            html[data-openclaw-boot-route="new"] #openclaw-boot-shell,
            .connect-splash[data-route="new"]
          )
          .loading-skeleton__header {
          flex-direction: row;
          justify-content: center;
        }

        :is(
            html[data-openclaw-boot-route="new"] #openclaw-boot-shell,
            .connect-splash[data-route="new"]
          )
          .loading-skeleton__header
          .loading-skeleton__avatar {
          width: 36px;
          height: 36px;
        }

        :is(
            html[data-openclaw-boot-route="new"] #openclaw-boot-shell,
            .connect-splash[data-route="new"]
          )
          .loading-skeleton__message--user
          > :first-child {
          display: none;
        }
      }

      body.openclaw-mount-fallback-active {
        --mount-fallback-bg: var(--bg-content, #0e1015);
        --mount-fallback-sidebar: #121419;
        --mount-fallback-rail: #15171c;
        --mount-fallback-rail-edge: #1f2126;
        --mount-fallback-divider: #36373c;
        --mount-fallback-edge: #1d1f24;
        --mount-fallback-text: var(--text-strong, #f4f4f5);
        --mount-fallback-muted: var(--muted, #8e8e97);
        --mount-fallback-glyph: rgba(188, 188, 192, 0.484);
        --mount-fallback-selected: #222429;
        --mount-fallback-skeleton: rgba(142, 142, 151, 0.1);
        --mount-fallback-skeleton-strong: rgba(142, 142, 151, 0.12);
        --mount-fallback-placeholder: rgba(142, 142, 151, 0.16);
        --mount-fallback-placeholder-strong: rgba(142, 142, 151, 0.2);
        --mount-fallback-ring: var(--ring, #ff5c5c);
        --mount-fallback-ground: radial-gradient(
          closest-side,
          rgb(0 0 0 / 0.42),
          rgb(0 0 0 / 0.16) 60%,
          transparent
        );

        margin: 0;
        color: var(--mount-fallback-text);
        background: var(--mount-fallback-bg);
        font-family: var(
          --font-body,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif
        );
        -webkit-font-smoothing: antialiased;
      }

      body.openclaw-mount-fallback-active openclaw-app {
        display: none;
      }

      .mount-fallback {
        box-sizing: border-box;
        height: 100vh;
        height: 100dvh;
        grid-template-columns: 310px minmax(0, 1fr);
        background: var(--mount-fallback-bg);
      }

      .mount-fallback:not([hidden]) {
        display: grid;
      }

      /* A still picture of the app shell; it carries no state or actions. */
      .mount-fallback__shell {
        display: flex;
        min-height: 0;
        border-inline-end: 1px solid var(--mount-fallback-edge);
        background: var(--mount-fallback-sidebar);
      }

      .mount-fallback__rail {
        box-sizing: border-box;
        display: flex;
        flex: none;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        width: 52px;
        padding: 4px 4px 8px;
        border-inline-end: 0.5px solid var(--mount-fallback-rail-edge);
        background: var(--mount-fallback-rail);
        color: var(--mount-fallback-glyph);
      }

      .mount-fallback__rail-item {
        display: grid;
        flex: none;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 12.5px;
      }

      .mount-fallback__rail-item svg {
        width: 19px;
        height: 19px;
      }

      .mount-fallback__rail-disc {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--mount-fallback-placeholder-strong);
      }

      .mount-fallback__rail-item.is-selected {
        background: color-mix(in srgb, var(--mount-fallback-selected) 50%, transparent);
        color: color-mix(in srgb, var(--mount-fallback-text) 60%, transparent);
      }

      .mount-fallback__rail-item.is-muted {
        opacity: 0.4;
      }

      .mount-fallback__rail-create {
        display: flex;
        flex: none;
        justify-content: center;
        width: 36px;
        padding-bottom: 8px;
        border-bottom: 0.5px solid var(--mount-fallback-divider);
      }

      .mount-fallback__rail-new {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        margin: 3px 0;
        border-radius: 12.5px;
        background: var(--mount-fallback-skeleton-strong);
        color: var(--mount-fallback-glyph);
      }

      .mount-fallback__rail-new svg {
        width: 19px;
        height: 19px;
      }

      .mount-fallback__rail-bottom {
        margin-top: auto;
      }

      .mount-fallback__rail-avatar {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
      }

      .mount-fallback__rail-avatar::before {
        content: "";
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--mount-fallback-placeholder);
      }

      .mount-fallback__skeleton {
        flex: 1;
        min-width: 0;
        padding: 12px 4px;
      }

      /* The wordmark's mascot centers on the session avatar column. */
      .mount-fallback__side-brand {
        display: block;
        width: auto;
        height: 20px;
        margin-inline-start: 8.6px;
        color: var(--mount-fallback-text);
      }

      /* Control UI session-row metrics: 32px rows, 18px avatar centered 24px in, title at 42px. */
      .mount-fallback__skeleton-rows {
        display: grid;
        margin-top: 16px;
      }

      .mount-fallback__skeleton-row {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 32px;
        padding-inline: 11px 8px;
      }

      .mount-fallback__skeleton-row::before,
      .mount-fallback__skeleton-row span {
        display: block;
        background: var(--mount-fallback-skeleton);
      }

      .mount-fallback__skeleton-row::before {
        content: "";
        flex: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--mount-fallback-skeleton-strong);
      }

      .mount-fallback__skeleton-row span {
        height: 10px;
        border-radius: 9999px;
      }

      .mount-fallback__skeleton-row:nth-child(1) span {
        width: 68%;
      }

      .mount-fallback__skeleton-row:nth-child(2) span {
        width: 50%;
      }

      .mount-fallback__skeleton-row:nth-child(3) span {
        width: 78%;
      }

      .mount-fallback__skeleton-row:nth-child(4) span {
        width: 58%;
      }

      .mount-fallback__main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        /* The app stylesheet clips the root scrollers, so this pre-app error
           surface must own its scrolling on short windows. */
        overflow-y: auto;
      }

      .mount-fallback__topbar {
        display: flex;
        flex: none;
        align-items: center;
        height: 53px;
        padding: 0 12px;
        color: var(--mount-fallback-text);
      }

      /* On desktop the sidebar header carries the wordmark; the bar keeps its height. */
      .mount-fallback__wordmark {
        display: block;
        width: 105px;
        height: 32px;
        visibility: hidden;
      }

      .mount-fallback__stage {
        flex: 1;
      }

      /* Every status page shares one anatomy: the OpenClaw mascot stands above a centred
         title, which holds a fixed height a little above centre, so nothing jumps. */
      .mount-fallback__main {
        position: relative;
      }

      .mount-fallback__panel {
        position: absolute;
        top: 38%;
        left: 50%;
        box-sizing: border-box;
        width: min(460px, calc(100% - 48px));
        transform: translateX(-50%);
        text-align: center;
      }

      /* The mascot is the busy indicator while recovery runs; once it stops, the mascot
         stands still and looks down toward Reload. */
      .mount-fallback__mascot {
        --mascot-size: 88px;
        --mascot-gx: 0px;
        --mascot-gy: 0px;
        position: absolute;
        top: calc(-24px - var(--mascot-size));
        left: 50%;
        width: var(--mascot-size);
        height: var(--mascot-size);
        transform: translateX(-50%);
        pointer-events: none;
      }

      .mount-fallback__mascot-ground {
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 62px;
        height: 9px;
        margin-left: -31px;
        border-radius: 50%;
        background: var(--mount-fallback-ground);
      }

      .mount-fallback__mascot-figure {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 124 / 112;
        overflow: visible;
      }

      .mount-fallback__mascot-eyes {
        transform: translate(var(--mascot-gx), var(--mascot-gy));
        transition: transform 0.5s cubic-bezier(0.3, 0, 0.2, 1);
      }

      .mount-fallback__mascot-lids {
        transform-origin: 60px 35px;
      }

      .mount-fallback__mascot-claw-left {
        transform-origin: 28px 52px;
      }

      .mount-fallback__mascot-claw-right {
        transform-origin: 92px 52px;
      }

      .mount-fallback[data-recovery="stopped"] .mount-fallback__mascot {
        --mascot-gy: 2.8px;
      }

      .mount-fallback:not([data-recovery="stopped"]) .mount-fallback__mascot-figure {
        animation: mount-fallback-bob 2.6s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
      }

      .mount-fallback:not([data-recovery="stopped"]) .mount-fallback__mascot-ground {
        animation: mount-fallback-ground 2.6s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
      }

      .mount-fallback:not([data-recovery="stopped"]) .mount-fallback__mascot-claw-left {
        animation: mount-fallback-pinch-left 2.6s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
      }

      .mount-fallback:not([data-recovery="stopped"]) .mount-fallback__mascot-claw-right {
        animation: mount-fallback-pinch-right 2.6s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
      }

      .mount-fallback:not([data-recovery="stopped"]) .mount-fallback__mascot-eyes {
        animation: mount-fallback-gaze 4.8s cubic-bezier(0.45, 0, 0.2, 1) infinite;
      }

      .mount-fallback:not([data-recovery="stopped"]) .mount-fallback__mascot-lids {
        animation: mount-fallback-blink 4.8s linear infinite;
      }

      @keyframes mount-fallback-bob {
        to {
          transform: translateY(-5px);
        }
      }

      @keyframes mount-fallback-ground {
        to {
          transform: scaleX(0.82);
          opacity: 0.7;
        }
      }

      @keyframes mount-fallback-pinch-left {
        to {
          transform: rotate(-7deg);
        }
      }

      @keyframes mount-fallback-pinch-right {
        to {
          transform: rotate(7deg);
        }
      }

      @keyframes mount-fallback-gaze {
        0%,
        8%,
        82%,
        100% {
          transform: translate(0, 0);
        }
        18%,
        40% {
          transform: translate(-3.2px, 0.6px);
        }
        50%,
        72% {
          transform: translate(3.2px, 0.6px);
        }
      }

      @keyframes mount-fallback-blink {
        0%,
        90%,
        96%,
        100% {
          transform: scaleY(1);
        }
        93% {
          transform: scaleY(0.12);
        }
      }

      .mount-fallback__panel h1 {
        margin: 0;
        color: var(--mount-fallback-text);
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 28px;
        text-wrap: balance;
      }

      .mount-fallback__panel p {
        margin: 6px 0 0;
        color: var(--mount-fallback-muted);
        font-size: 14px;
        line-height: 21px;
        text-wrap: pretty;
      }

      .mount-fallback__panel a {
        color: var(--mount-fallback-muted);
        font-size: 14px;
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.18em;
      }

      .mount-fallback__panel a:hover {
        color: var(--mount-fallback-text);
      }

      .mount-fallback__actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 32px;
        margin-top: 20px;
      }

      .mount-fallback__panel .mount-fallback__help {
        display: flex;
        align-items: center;
        gap: 6px;
        width: max-content;
        margin: 32px auto 0;
        font-size: 13px;
        line-height: 16px;
        text-decoration: none;
      }

      .mount-fallback__help svg {
        flex: none;
        width: 14px;
        height: 14px;
      }

      .mount-fallback__panel .mount-fallback__help[hidden],
      .mount-fallback:not([data-recovery="stopped"]) .mount-fallback__panel .mount-fallback__help {
        display: none;
      }

      .mount-fallback__button {
        appearance: none;
        height: 32px;
        border: 0;
        border-radius: 12px;
        padding: 0 14px;
        color: inherit;
        background: color-mix(in srgb, var(--mount-fallback-text) 6%, var(--mount-fallback-bg));
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        line-height: 1;
        cursor: default;
        transition: background 120ms ease;
      }

      .mount-fallback__button:hover {
        background: color-mix(in srgb, var(--mount-fallback-text) 9%, var(--mount-fallback-bg));
      }

      .mount-fallback__button:active {
        background: color-mix(in srgb, var(--mount-fallback-text) 16%, var(--mount-fallback-bg));
      }

      .mount-fallback__button--primary {
        color: var(--primary-foreground, #ffffff);
        background: var(--primary, #d13c3c);
      }

      .mount-fallback__button--primary:hover,
      .mount-fallback__button--primary:active {
        background: var(--primary-hover, #c22e2e);
      }

      .mount-fallback__panel:focus {
        outline: none;
      }

      .mount-fallback__button:focus-visible,
      .mount-fallback__panel a:focus-visible {
        outline: 2px solid var(--mount-fallback-ring);
        outline-offset: 3px;
      }

      html[data-theme-mode="light"] body.openclaw-mount-fallback-active {
        --mount-fallback-bg: var(--bg-content, #f8f8f8);
        --mount-fallback-sidebar: #f4f4f4;
        --mount-fallback-rail: #f0f0f0;
        --mount-fallback-rail-edge: #ebebeb;
        --mount-fallback-divider: #d1d1d1;
        --mount-fallback-edge: #ededed;
        --mount-fallback-text: var(--text-strong, #202020);
        --mount-fallback-muted: var(--muted, #5e5e5e);
        --mount-fallback-glyph: rgba(53, 53, 53, 0.6);
        --mount-fallback-selected: #e5e5e5;
        --mount-fallback-skeleton: rgba(94, 94, 94, 0.1);
        --mount-fallback-skeleton-strong: rgba(94, 94, 94, 0.12);
        --mount-fallback-placeholder: rgba(94, 94, 94, 0.16);
        --mount-fallback-placeholder-strong: rgba(94, 94, 94, 0.2);
        --mount-fallback-ring: var(--ring, #bd4531);
        --mount-fallback-ground: radial-gradient(
          closest-side,
          rgb(32 32 32 / 0.16),
          rgb(32 32 32 / 0.06) 60%,
          transparent
        );
      }

      html[data-theme-mode="light"] .mount-fallback__button--primary {
        background: var(--primary, #bd4531);
      }

      html[data-theme-mode="light"] .mount-fallback__button--primary:hover,
      html[data-theme-mode="light"] .mount-fallback__button--primary:active {
        background: var(--primary-hover, #a83c29);
      }

      @media (max-width: 768px) {
        .mount-fallback {
          grid-template-columns: minmax(0, 1fr);
        }

        .mount-fallback__shell {
          display: none;
        }

        .mount-fallback__topbar {
          align-items: flex-start;
          justify-content: center;
          padding-top: max(14.5px, env(safe-area-inset-top));
        }

        .mount-fallback__wordmark {
          visibility: visible;
        }

        .mount-fallback__panel {
          top: 36%;
          right: 24px;
          left: 24px;
          width: auto;
          transform: none;
        }

        .mount-fallback__panel h1 {
          font-size: 20px;
          line-height: 26px;
        }

        .mount-fallback__mascot {
          --mascot-size: 80px;
        }
      }

      @media (max-width: 768px), (pointer: coarse) {
        .mount-fallback__button {
          height: 36px;
          border-radius: 13px;
          padding: 0 16px;
          font-size: 14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mount-fallback__button {
          transition: none;
        }

        .mount-fallback:not([data-recovery="stopped"]) .mount-fallback__mascot-eyes {
          animation-duration: 12s;
        }

        .mount-fallback
          :is(
            .mount-fallback__mascot-figure,
            .mount-fallback__mascot-ground,
            .mount-fallback__mascot-claw-left,
            .mount-fallback__mascot-claw-right,
            .mount-fallback__mascot-lids
          ) {
          animation: none !important;
        }
      }
    </style>
  </head>

    <script data-cfasync="false">
      // A chat link accepts typing at first paint; Enter only records intent.
      // app/boot-composer.ts carries this element to the chat pane. Enter, IME
      // and touch rules mirror lib/ime.ts, lib/browser-platform.ts and the chat
      // composer's keydown handler.
      (function () {
        var root = document.documentElement;
        var input = document.getElementById("openclaw-boot-composer");
        if (!input || !root.hasAttribute("data-openclaw-boot-chat")) return;
        var nav = navigator;
        // Touch Return keeps native editing, matching the chat composer.
        var touch =
          /iPad|iPhone|iPod|Android/.test(nav.userAgent) ||
          (nav.platform === "MacIntel" && nav.maxTouchPoints > 1);
        var modifier = root.hasAttribute("data-openclaw-boot-send-shortcut");
        var composedAt = -1;
        input.addEventListener("compositionend", function (event) {
          composedAt = event.timeStamp;
        });
        input.addEventListener("keydown", function (event) {
          if (
            event.key !== "Enter" ||
            event.shiftKey ||
            touch ||
            event.isComposing ||
            event.keyCode === 229 ||
            (composedAt >= 0 && Math.abs(event.timeStamp - composedAt) < 100) ||
            (modifier && !event.metaKey && !event.ctrlKey)
          ) {
            return;
          }
          event.preventDefault();
          input.toggleAttribute("data-submit-queued", input.value.trim() !== "");
        });
        input.addEventListener("input", function () {
          input.removeAttribute("data-submit-queued");
        });
        input.addEventListener("focus", function () {
          input.setAttribute("data-focused", "");
        });
        input.addEventListener("blur", function () {
          // Loading frames move this node within a task; a lasting blur is the operator's.
          setTimeout(function () {
            if (input.isConnected && document.activeElement !== input) {
              input.removeAttribute("data-focused");
            }
          }, 0);
        });
      })();
    </script>

                </g></svg
            ></span>
            <h1 id="openclaw-mount-fallback-title">OpenClaw didn’t start</h1>
            <p id="openclaw-mount-fallback-summary">
              The page loaded, but the app didn’t start. Trying again automatically.
            </p>
            <div class="mount-fallback__actions">
              <button
                type="button"
                id="openclaw-mount-retry"
                class="mount-fallback__button mount-fallback__button--primary"
              >
                Reload
              </button>
            </div>
            <a
              id="openclaw-mount-help"
              class="mount-fallback__help"
              href="https://docs.openclaw.ai/web/control-ui#blank-control-ui-page"
              target="_blank"
              rel="noopener noreferrer"
              ><svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="10" />
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                <path d="M12 17h.01" /></svg
              >Troubleshooting</a
            >
          </div>
        </div>
      </div>
    </section>
    <script data-cfasync="false">
      (function () {
        var app = document.querySelector("openclaw-app");
        var fallback = document.getElementById("openclaw-mount-fallback");
        if (!app || !fallback) return;

        var panel = fallback.querySelector(".mount-fallback__panel");
        var title = document.getElementById("openclaw-mount-fallback-title");
        var summary = document.getElementById("openclaw-mount-fallback-summary");
        var failureSummary = summary.textContent;
        var retry = document.getElementById("openclaw-mount-retry");
        var recoveryActions = fallback.querySelector(".mount-fallback__actions");
        function setManualRecovery(manual) {
          if (recoveryActions) recoveryActions.style.display = manual ? "" : "none";
          fallback.setAttribute("data-recovery", manual ? "stopped" : "running");
        }
        setManualRecovery(false);
        var rawDelay = Number(fallback.getAttribute("data-openclaw-mount-timeout-ms"));
        var delay = Number.isFinite(rawDelay) && rawDelay > 0 ? rawDelay : 12000;
        var maxRecoveryNavigations = 3;
        var timer;
        var recoveryTimer;
        var recoveryAttempt = 0;
        var recoveryNavigation = 0;
        var bootSettled = false;
        var documentLoaded = document.readyState === "complete";
        var recoveryController;

        // The recovery page cannot import the app's drag helper when its bundle failed.
        fallback.addEventListener("mousedown", function (event) {
          if (event.button !== 0 || event.defaultPrevented) return;
          // The decorative shell and empty page drag the window; the message and its actions do not.
          if (!(event.target instanceof Element) || event.target.closest(".mount-fallback__panel"))
            return;
          var drag = window.webkit?.messageHandlers?.openclawWindowDrag;
          if (!drag) return;
          try {
            drag.postMessage({ type: "window-drag" });
            event.preventDefault();
          } catch (e) {}
        });

        try {
          var initialUrl = new URL(window.location.href);
          var recoveryMarker = initialUrl.searchParams.get("openclaw_mount_recovery");
          // Runtime reloads pass a timestamp cache buster; count it as the first recovery navigation.
          if (recoveryMarker !== null) {
            var count = Number(recoveryMarker);
            recoveryNavigation =
              Number.isInteger(count) && count >= 1 && count <= maxRecoveryNavigations ? count : 1;
          }
          if (recoveryNavigation || initialUrl.searchParams.has("openclaw_http_auth")) {
            initialUrl.searchParams.delete("openclaw_mount_recovery");
            initialUrl.searchParams.delete("openclaw_http_auth");
            window.history.replaceState(null, "", initialUrl.href);
          }
        } catch (e) {}

        function hideFallback() {
          fallback.hidden = true;
          document.body.classList.remove("openclaw-mount-fallback-active");
        }

        function setSummary(text) {
          if (summary) summary.textContent = text;
        }

        function cancelRecovery() {
          window.clearTimeout(recoveryTimer);
          if (recoveryController) recoveryController.abort();
          recoveryController = undefined;
        }

        function scheduleRecovery() {
          window.clearTimeout(recoveryTimer);
          if (bootSettled) return;
          var retryDelay = Math.min(15000, 1000 * Math.pow(2, Math.min(recoveryAttempt - 1, 4)));
          recoveryTimer = window.setTimeout(retryCurrentDocument, retryDelay);
        }

        function finishRecoveryAttempt() {
          recoveryController = undefined;
          if (bootSettled) return;
          setSummary("Couldn’t reach OpenClaw to reload this page. Trying again automatically.");
          scheduleRecovery();
        }

        function retryCurrentDocument() {
          if (bootSettled || recoveryController) return;
          if (typeof window.fetch !== "function") {
            setManualRecovery(true);
            setSummary("This browser can’t retry automatically. Reload the page to try again.");
            return;
          }
          setManualRecovery(false);
          var documentUrl = new URL(window.location.href);
          if (recoveryNavigation >= maxRecoveryNavigations) {
            setManualRecovery(true);
            setSummary("The app didn’t load in this tab.");
            return;
          }
          recoveryAttempt += 1;
          documentUrl.searchParams.set("openclaw_mount_recovery", String(recoveryNavigation + 1));
          var controller = new AbortController();
          recoveryController = controller;
          var requestTimer = window.setTimeout(function () {
            controller.abort();
          }, delay);
          window
            .fetch(documentUrl.href, {
              cache: "no-store",
              credentials: "same-origin",
              signal: controller.signal,
            })
            .then(function (response) {
              if (!response.ok) throw new Error("gateway unavailable");
              if (!bootSettled && recoveryController === controller)
                window.location.replace(documentUrl.href);
            })
            .catch(function () {
              if (recoveryController !== controller) return;
              // Network failure says nothing about worker health. Keep offline recovery.
              finishRecoveryAttempt();
            })
            .finally(function () {
              window.clearTimeout(requestTimer);
            });
        }

        function showFallback() {
          if (bootSettled) return;
          title.textContent = documentLoaded
            ? "OpenClaw didn’t start"
            : "OpenClaw is still loading";
          fallback.setAttribute("role", documentLoaded ? "alert" : "status");
          setSummary(documentLoaded ? failureSummary : "The app is still downloading.");
          if (documentLoaded) retryCurrentDocument();
          fallback.hidden = false;
          document.body.classList.add("openclaw-mount-fallback-active");
          if (documentLoaded && panel && typeof panel.focus === "function") {
            try {
              panel.focus({ preventScroll: true });
            } catch (e) {
              panel.focus();
            }
          }
        }

        function armFallbackTimer() {
          window.clearTimeout(timer);
          timer = window.setTimeout(showFallback, delay);
        }

        armFallbackTimer();

        // The nonblocking entry sheet can outlive DOMContentLoaded. A slow
        // download is not a failed bootstrap: recovery would cancel it.
        document.addEventListener(
          "DOMContentLoaded",
          function () {
            var styles = document.getElementById("openclaw-boot-styles");
            function finishDocumentLoad() {
              if (styles) {
                styles.removeEventListener("load", finishDocumentLoad);
                styles.removeEventListener("error", finishDocumentLoad);
              }
              documentLoaded = true;
              if (!bootSettled) armFallbackTimer();
            }
            if (styles && styles.media === "print") {
              styles.addEventListener("load", finishDocumentLoad, { once: true });
              styles.addEventListener("error", finishDocumentLoad, { once: true });
            } else {
              finishDocumentLoad();
            }
          },
          { once: true },
        );

        function retireMountRecovery() {
          bootSettled = true;
          window.clearTimeout(timer);
          cancelRecovery();
          hideFallback();
        }

        window.addEventListener("openclaw-control-ui-rendered", retireMountRecovery, {
          once: true,
        });
        // Admission rejection is terminal even while its fallback assets are still loading.
        window.addEventListener("openclaw-control-ui-unsupported-browser", retireMountRecovery, {
          once: true,
        });

        window.addEventListener(
          "openclaw-control-ui-unsupported-browser-failed",
          function () {
            title.textContent = "Browser guidance didn’t load";
            setSummary("Check your connection, then reload the page.");
            document.getElementById("openclaw-mount-help").hidden = true;
            fallback.hidden = false;
            document.body.replaceChildren(
              document.getElementById("openclaw-wordmark-letters").ownerSVGElement,
              fallback,
            );
            document.body.classList.add("openclaw-mount-fallback-active");
            setManualRecovery(true);
            retry.focus();
          },
          { once: true },
        );

        retry.addEventListener("click", function () {
          cancelRecovery();
          window.location.reload();
        });
      })();
    </script>
    <script data-cfasync="false" nomodule>
      document.body.innerHTML =
        '<main style="padding:24px;color:#f4f4f5"><h1>This browser is not supported</h1><p>Open OpenClaw in an up-to-date browser, or update your system WebView.</p></main>';
    </script>
    <script data-cfasync="false" type="module" src="/src/main.ts"></script>
  </body>
</html>
