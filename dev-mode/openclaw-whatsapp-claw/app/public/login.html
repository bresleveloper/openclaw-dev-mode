<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WhatsApp Claw — Sign in</title>
    <style>
      body {
        font: 14px/1.4 system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0f2f5;
      }
      form {
        width: 320px;
        padding: 28px 32px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 1px 8px rgba(0, 0, 0, 0.15);
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p {
        color: #888;
        font-size: 13px;
        margin: 0 0 16px;
      }
      input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        padding: 9px;
        border: 0;
        border-radius: 4px;
        background: #25d366;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      .err {
        color: #b00020;
        font-size: 13px;
        margin-bottom: 12px;
      }
      .err.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <form method="POST" action="/login">
      <h1>WhatsApp Claw</h1>
      <p>Enter the OpenClaw gateway token (the same token the Control UI uses).</p>
      <div id="err" class="err hidden">Invalid token — try again.</div>
      <input
        name="token"
        type="password"
        placeholder="Gateway token"
        autocomplete="current-password"
        autofocus
        required
      />
      <button type="submit">Sign in</button>
    </form>
    <script>
      if (new URLSearchParams(location.search).has("error")) {
        document.getElementById("err").classList.remove("hidden");
      }
    </script>
  </body>
</html>
